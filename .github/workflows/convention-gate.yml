name: convention gate

# NOT to be confused with conventions.yml at the repository root. That file is
# the convention manifest read by bin/hook-guard.php and bin/check-change.php.
# This file is a GitHub Actions workflow. Same subject, different kind of thing.

on:
  pull_request:
    branches: [ '*' ]

permissions:
  contents: read
  pull-requests: write

jobs:
  gate:
    name: gate (php ${{ matrix.php }})
    runs-on: ubuntu-24.04
    strategy:
      fail-fast: false
      matrix:
        # 8.4 is the declared minimum for this branch. 8.5 is what the author
        # runs locally, and editor and pipeline disagreeing is the failure this
        # whole artifact exists to prevent. Upstream also tests 8.6, which is
        # unreleased; a token walker is exactly the tool that breaks on new
        # syntax, so carrying an unreleased runtime buys nothing here.
        php: [ '8.4', '8.5' ]

    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          fetch-depth: 0
          persist-credentials: false

      - uses: shivammathur/setup-php@f3e473d116dcccaddc5834248c87452386958240 # 2.37.2
        with:
          php-version: '${{ matrix.php }}'
          extensions: intl, mbstring
          coverage: none

      - name: Sanity check the artifact layout
        # conventions.yml living in bin/ meant hook-guard.php silently fell back
        # to hardcoded defaults, and every output looked correct. Fail loudly
        # here rather than let CI pass on a boundary nobody declared.
        run: |
          test -f conventions.yml || {
            echo "conventions.yml must be at the repository root, not in bin/." >&2
            exit 1
          }
          php -l bin/check-change.php
          php -l bin/hook-guard.php
          php bin/selftest.php

      - name: Locate the change record
        id: record
        # BASE_REF travels through env rather than being expanded directly
        # into the script: a template expression inlined into a run: block
        # is text-substituted before bash ever sees it, so any value
        # containing shell metacharacters becomes code rather than data. An
        # env var is passed as a value, not spliced into the script text.
        env:
          BASE_REF: ${{ github.base_ref }}
        run: |
          file=$(git diff --name-only "origin/$BASE_REF...HEAD" -- '.change/*.yml' | head -1)
          if [ -z "$file" ]; then
            echo "No change record in this pull request." >&2
            echo "Every change carries one. Run /plan-change." >&2
            exit 1
          fi
          echo "file=$file" >> "$GITHUB_OUTPUT"
          echo "Using $file"

      - name: Install dependencies
        # Default resolution only. Lowest allowed dependencies pull in older
        # Symfony versions that emit their own deprecations, and the helper
        # cannot separate those from the one under test.
        run: composer install --no-interaction --no-progress

      - name: Gate, before tests
        # C1 through C4 in full. C5 verifies the named tests exist but cannot
        # yet confirm they ran.
        env:
          RECORD_FILE: ${{ steps.record.outputs.file }}
          BASE_REF: ${{ github.base_ref }}
        run: php bin/check-change.php "$RECORD_FILE" --base "origin/$BASE_REF"

      - name: Component test suite
        env:
          SYMFONY_DEPRECATIONS_HELPER: max[self]=0
        # The same groups upstream's own unit-tests.yml excludes, for the same
        # reasons: a hosted runner has no interactive stdin (tty), no intl
        # data fixtures (intl-data), and isn't set up for benchmark,
        # integration, or transient suites. QuestionHelperTest is
        # #[Group('tty')], and without excluding it testAskTimeout and
        # testAskThrowsExceptionOnMissingInputForChoiceQuestion abort
        # immediately instead of exercising the behaviour under test. Console
        # has no tests in the other four groups today, so this changes
        # nothing yet; it matches upstream's own list so a future test
        # doesn't quietly reintroduce the same class of environment-only
        # failure. Every other failure still surfaces: this mirrors
        # upstream's own exclusion rather than widening it.
        #
        # InvokableCommandTest::testAskWithVariadicInputFilesCollectsAndStacks
        # was previously excluded by name on the belief that it errors on a
        # clean checkout. Re-measured 2026-09-12: it passes in isolation, in
        # the full local Console suite, with this exact phpunit invocation,
        # and on symfony/symfony's own Unit Tests (8.4) and (8.5) CI at the
        # commit this fork's 8.2 was branched from. No environment tried
        # reproduces the failure, so the --filter exclusion is removed here
        # to let this runner settle the question directly: if it fails here,
        # the exclusion goes back with the runner's own evidence attached
        # instead of an unconfirmed belief.
        run: |
          mkdir -p build
          ./phpunit src/Symfony/Component/Console \
            --exclude-group tty --exclude-group benchmark --exclude-group intl-data --exclude-group integration --exclude-group transient \
            --log-junit build/junit.xml

      - name: Gate, after tests
        id: gate
        env:
          JUNIT_XML: build/junit.xml
          RECORD_FILE: ${{ steps.record.outputs.file }}
          BASE_REF: ${{ github.base_ref }}
        # Same script, same manifest, same logic as the local run. C5 now
        # verifies execution rather than existence, which is the difference
        # between a change record that documents intent and one that is
        # enforced.
        run: |
          php bin/check-change.php "$RECORD_FILE" \
            --base "origin/$BASE_REF" --format=json | tee build/gate.json
          php bin/check-change.php "$RECORD_FILE" \
            --base "origin/$BASE_REF"

      - name: Summary comment
        if: always() && matrix.php == '8.5'
        env:
          GH_TOKEN: ${{ github.token }}
          RECORD_FILE: ${{ steps.record.outputs.file }}
          PR_NUMBER: ${{ github.event.pull_request.number }}
        # One sticky comment updated in place. Three separate comments would
        # duplicate on every rerun and triple the notification volume, and the
        # per role subscription people imagine as the benefit does not exist.
        run: |
          php bin/pr-comment.php build/gate.json "$RECORD_FILE" > build/comment.md
          gh pr comment "$PR_NUMBER" \
            --body-file build/comment.md --edit-last --create-if-none
