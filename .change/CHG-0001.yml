# Change record. Written by /plan-change, read by the checker, the CI gate and
# three audiences who never open the diff.
#
# Product reads acceptance statements and the release note.
# QA reads the named tests.
# DevOps reads the branch, the paths and the dependency delta.

id: CHG-0001
change_type: deprecation          # bug_fix | feature | deprecation

target:
  component: Console
  branch: "8.2"
  paths:
    - "src/Symfony/Component/Console/**"
    # The pull request template requires an upgrade entry for a deprecation, so
    # a deprecation's scope is the component plus the upgrade file for the
    # target branch. C2 demands this file and C4 forbids anything undeclared,
    # so the record has to name it or the two checks contradict each other.
    - "UPGRADE-8.2.md"

owner: "@chalasr"                 # resolved from .github/CODEOWNERS, not typed

deprecates:
  symbol: 'Symfony\Component\Console\Input\InputOption::isValueRequired()'
  replacement: 'Symfony\Component\Console\Input\InputOption::valueMode()'
  since: "8.2"

release_note: >
  InputOption::isValueRequired() is deprecated in 8.2. Use valueMode(), which
  returns the mode directly rather than answering one question about it.
  Behaviour is unchanged for existing callers until the next major.

acceptance:
  - id: AC1
    statement: Calling isValueRequired() emits a deprecation naming valueMode()
    test: 'Symfony\Component\Console\Tests\Input\InputOptionTest::testIsValueRequiredIsDeprecated'
  - id: AC2
    statement: valueMode() returns the same answer isValueRequired() did
    test: 'Symfony\Component\Console\Tests\Input\InputOptionTest::testValueModeMatchesLegacyAccessor'
