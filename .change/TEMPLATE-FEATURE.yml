# Change record template: feature.
#
# No feature record has been produced or gated. Reading the checker is not
# the same as running it against a real record, so nothing here is measured
# the way CHG-0001 and CHG-0002 measured TEMPLATE-DEPRECATION.yml.
#
# What reading it settles (bin/check-change.php and bin/lib/ at e617ecc96e7):
# no check reads a field this template lacks, so no field was added. C1-C5
# branch on change_type only where a deprecation adds a requirement
# (check-change.php:255, 299), and record.php:208-214 is the only
# type-specific schema rule. Nothing treats feature as more than an enum
# member. Not wired into the onboarding-starter automation, which stops and
# comments unless the labeled issue is a Console deprecation.
#
# The same two open questions from TEMPLATE-DEPRECATION.yml apply here:
#   - license field: keep, or drop entirely.
#   - acceptance id prefix: "AC1" style vs "A1" style.

id: CHG-<n>

change_type: feature                 # bug_fix | feature | deprecation

owner: "@handle"                     # resolved from .github/CODEOWNERS by
                                      # most specific match. Unread by C1-C5
                                      # but not unused, as are release_note
                                      # and license: bin/pr-body.php reads
                                      # all three (lines 62-66, 93). Do not
                                      # drop them.

issues: "Fix #<n>"                   # the reported issue, verbatim into
                                      # the PR table's Issues row
                                      # (bin/pr-body.php:61). Quote it: the
                                      # space before # makes YAML read the
                                      # rest as a comment, leaving "Fix".
                                      # Several go in one string,
                                      # "Fix #1, Fix #2"; a list renders as
                                      # "Array". Omit if none exists and
                                      # explain in the release note.

# license: MIT                       # UNCONFIRMED, see header

release_note: >
  What this adds and why, in the words of the person who asked for it.

target:
  component: <Component>
  branch: "<branch>"                 # Ask. C3 does not settle this: it only
                                      # compares this with the pull request's
                                      # base and encodes no branch policy
                                      # (check-change.php:371-423).
                                      # PULL_REQUEST_TEMPLATE.md:3 says "8.2
                                      # for features", but nothing enforces
                                      # it and that number ages with the
                                      # release cycle.
  paths:
    - "src/Symfony/Component/<Component>/**"
    # C2 demands no changelog and no upgrade entry for a feature that
    # deprecates nothing; it skips unless the record is a deprecation or the
    # diff adds one (check-change.php:299). That is a fact about the checker,
    # not the convention: PULL_REQUEST_TEMPLATE.md:5 asks a new feature for a
    # changelog entry. Write one anyway.
    #
    # The gate is `|| $checkable > 0`, so a feature that deprecates the API
    # it replaces turns C2 on and then demands both files. Declare
    # UPGRADE-<branch>.md here if that happens: C4 is type-blind and
    # conventions.yml's artifact_paths does not cover it.

# No deprecates-equivalent block exists for this change_type. Leave empty
# rather than inventing one. Confirmed by reading the checker, not by gating
# a record: an absent block here is never read, not skipped and not an error.
#
# The asymmetry worth knowing: C1's scan is type-blind
# (check-change.php:164-253). A feature that annotates the superseded API
# @deprecated without a paired trigger_deprecation call fails C1 like any
# deprecation.

acceptance:
  - id: AC1
    statement: <one observable statement describing the new behaviour>
    # Unread by C1-C5 but required by the schema (record.php:225): omit it
    # and the record exits 2 before any check runs.
    test: '<Fully\Qualified\Namespace>\Tests\<Class>Test::<testMethod>'
    # Name the test even if it does not exist yet. C5 is type-blind
    # (check-change.php:512-547) and fails here exactly as it would there.
